name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the idea against
        the project's scope first: LedgerPilot operates PayPal
        flows (Invoicing v2, Orders v2, Payouts, Webhooks,
        read-only Disputes and Transaction Search) for solo
        sellers and freelancers, behind an approval gate, in
        sandbox and mock mode only — there is no real-money mode.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who hits it, and what goes wrong or stays manual today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: |
        What should happen instead? If the idea moves money, say
        where the approval gate sits — nothing in LedgerPilot
        executes without a typed plan plus an explicit approval.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other shapes you weighed, and why this one fits better.
